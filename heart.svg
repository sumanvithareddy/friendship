<svg width="500" height="500" viewBox="0 0 500 500"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d6d"/>
            <stop offset="100%" stop-color="#ff8fab"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- Heart -->
    <path
        d="M250 430
           L220 400
           C80 270 40 170 120 100
           C180 45 250 90 250 145
           C250 90 320 45 380 100
           C460 170 420 270 280 400
           Z"
        fill="url(#heartGradient)"
        filter="url(#glow)"/>

    <!-- Title -->
    <text
        x="250"
        y="180"
        text-anchor="middle"
        font-size="24"
        fill="white"
        font-family="Poppins"
        font-weight="bold">

        Forever Friends

    </text>

    <!-- Names -->

    <text
        x="250"
        y="240"
        text-anchor="middle"
        font-size="22"
        fill="white"
        font-family="Poppins">

        ❤️ Sumanvitha ❤️

    </text>

    <text
        x="250"
        y="275"
        text-anchor="middle"
        font-size="22"
        fill="white"
        font-family="Poppins">

        ❤️ Manasa ❤️

    </text>

    <text
        x="250"
        y="310"
        text-anchor="middle"
        font-size="22"
        fill="white"
        font-family="Poppins">

        ❤️ Jeevitha ❤️

    </text>

    <!-- Quote -->

    <text
        x="250"
        y="355"
        text-anchor="middle"
        font-size="14"
        fill="white"
        font-family="Poppins">

        Together in memories...

    </text>

    <text
        x="250"
        y="375"
        text-anchor="middle"
        font-size="14"
        fill="white"
        font-family="Poppins">

        Forever in our hearts.

    </text>

</svg>
